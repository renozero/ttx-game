<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>TTX KPK Scoring Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b2430;--mu:#5d6877;--bd:#d9dee5;--ac:#8a1c1c;--ac2:#f6e9e9;--ok:#1d7a46;--wa:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#98a3b1;--bd:#2e3844;--ac:#e07a7a;--ac2:#33201f;--ok:#5fc78b;--wa:#e0a24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#98a3b1;--bd:#2e3844;--ac:#e07a7a;--ac2:#33201f;--ok:#5fc78b;--wa:#e0a24a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;margin:0}header small{opacity:.85}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi b{font-size:26px;display:block}.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:var(--ac2);border-color:var(--ac);font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}
.sc{display:flex;gap:6px;flex-wrap:wrap}.sc button{width:42px;height:42px;padding:0}
textarea,input,select{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:600}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.b.ok{color:var(--ok);border-color:var(--ok)}.b.wa{color:var(--wa);border-color:var(--wa)}
ul.r{margin:6px 0 10px;padding-left:18px;color:var(--mu);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:16px;background:var(--ac);border-radius:4px}.bar span{width:110px;font-size:13px;flex:none}
.bot{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.warn{color:var(--wa)}

.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.lv button{height:auto;width:auto;padding:8px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.2}.lv b{font-size:20px}.lv small{font-size:10.5px;opacity:.85}
.hint{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--ac2);font-size:13px}
.card.ok{border-left:4px solid var(--ok)}details summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:8px}details textarea{margin-top:6px}
.pg{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:4px}.pg i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.show{opacity:1}
.tc{text-align:left;padding:14px;height:auto}.tc b{font-size:17px}
body.bd header{display:none}.bhd{text-align:center;padding:18px 0 8px}.bhd h1{font-size:clamp(28px,5vw,46px);margin:0;color:var(--ac)}.bhd p{margin:4px 0 12px;color:var(--mu)}
.br{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 16px}.br .rk{font-size:30px;text-align:center}.br .nm{font-size:clamp(18px,3vw,26px);font-weight:700}.br .sc2{font-size:clamp(24px,4vw,38px);font-weight:700}
.br .bb{height:10px;background:var(--bd);border-radius:99px;margin-top:6px;overflow:hidden}.br .bb i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bctl{text-align:center;margin:16px 0;opacity:.7}
@media(max-width:480px){.lv small{font-size:9px}.lv b{font-size:17px}}
</style></head><body>
<header><h1>TTX KPK Scoring Dashboard</h1><small><a href="#" style="color:#fff" onclick="go('home');return false">Beranda</a></small></header>
<main id="app"><div class="card">Memuat…</div></main>
<script>
const TEAMS=["ACLC","KWS","SPDP","GOL","LHKPN","Salma","SPI Pendidikan","PPID"].map((n,i)=>({id:"t"+(i+1),n}));
const INJ=[
["Pemberitaan Dugaan Kebocoran",["Verifikasi klaim dan amankan bukti.","Koordinasi lintas role; jangan berspekulasi."]],
["Kredensial Valid",["Amankan akun, reset kata sandi, cabut sesi/token sesuai risiko.","Amankan bukti dan log; tetapkan penanggung jawab tindakan."]],
["Login Tidak Dikenali",["Periksa log dan aktivitas setelah login.","Hentikan akses tidak sah; amankan bukti digital."]],
["Akses ke Data Pribadi",["Identifikasi jenis data, cakupan akses, dan potensi dampak.","Batasi akses berdasarkan risiko dengan mempertimbangkan keberlangsungan layanan."]],
["Login Tanpa MFA",["Identifikasi kelemahan autentikasi satu faktor; amankan akun dan sesi.","Usulkan MFA dan penguatan kontrol akses."]],
["Sampel Data Beredar",["Validasi sampel dan telusuri cakupan paparan berdasarkan bukti.","Amankan bukti dan mulai penilaian kewajiban PDP."]],
["Kepastian Humas dan Hukum",["Siapkan laporan pimpinan dan pernyataan publik berbasis fakta.","Nilai kewajiban pemberitahuan PDP; kelola tenggat 3 × 24 jam jika berlaku."]],
["Keputusan dan Eskalasi",["Tetapkan tindakan containment, penanggung jawab, dan status layanan.","Koordinasikan Gov-CSIRT tanpa menunggu investigasi selesai; kewajiban PDP tetap berjalan.","Tetapkan rencana tindak lanjut 24 jam, 7 hari, dan 30 hari."]]];
const CAT=[["Koordinasi lintas fungsi dan kejelasan peran",15],["Kualitas keputusan berbasis risiko dan keberlangsungan layanan",15],["Akuntabilitas, komunikasi, dan tindak lanjut",10]];
const CATI=[["PIC dan peran setiap fungsi jelas","Eskalasi tepat ke CSIRT/IT, pemilik aplikasi, hukum, dan pimpinan","Kolaborasi lintas fungsi berjalan tertib dan saling melengkapi","Keputusan diambil oleh pihak yang berwenang"],["Keputusan didasarkan pada fakta dan tingkat risiko","Menyeimbangkan keamanan dengan keberlangsungan layanan","Mitigasi proporsional (tidak berlebihan atau kurang)","Mempertimbangkan dampak ke akun dan aplikasi lain"],["Komunikasi satu jalur resmi, faktual, tanpa spekulasi","Kronologi dan bukti tercatat rapi","Rencana tindak lanjut 24 jam, 7 hari, 30 hari dengan PIC dan tenggat","MFA dan evaluasi aplikasi lain ditetapkan"]];
const SCALE="1 Sangat lemah · 2 Kurang · 3 Cukup · 4 Baik · 5 Sangat baik";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const valid=v=>Number.isInteger(v)&&v>=1&&v<=5;
const done=s=>s&&s.inj&&s.cat&&s.inj.length==8&&s.cat.length==3&&s.inj.every(valid)&&s.cat.every(valid);
const sumInj=s=>s.inj.reduce((a,v)=>a+(valid(v)?v:0),0);
const wt=s=>s.cat.map((v,i)=>valid(v)?v/5*CAT[i][1]:0);
const total=s=>Math.round((sumInj(s)*1.5+wt(s).reduce((a,b)=>a+b,0))*100)/100;
const blank=id=>({team:id,evaluator:"",state:"none",inj:Array(8).fill(null),cat:Array(3).fill(null),notes:Array(8).fill(""),catNotes:"",hist:[]});
let db,T={},FIN=null,view="home",cur=null,D=null,sel="t1",tab="ring";
const st=id=>T[id]?.state=="submitted"?"Terkirim":T[id]?.state=="draft"||T[id]?.state=="reopened"?"Draft":"Belum Dimulai";
const badge=id=>{const l=st(id);return `<span class="b ${l=="Terkirim"?"ok":l=="Draft"?"wa":""}">${l}</span>`};
const SB="https://tzgednbdwttjavbdcyrn.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6Z2VkbmJkd3R0amF2YmRjeXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjc3MDMsImV4cCI6MjEwNzYwMzcwM30.cQjGg9xpTuD9CkOpyY2wOzddZSRztQZyI1mcCiwQBXI";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
async function rq(p,o={}){const r=await fetch(SB+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});const t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m)}return t?JSON.parse(t):null}
const fromRow=r=>({team:r.team_id,evaluator:r.evaluator||"",state:r.state,inj:r.inj,cat:r.cat,notes:r.notes,catNotes:r.cat_notes||"",hist:r.hist||[]});
const UP={method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"}};
const api={
 async load(){const [a,b]=await Promise.all([rq("evaluations?select=*"),rq("final_result?select=*")]);T={};a.forEach(x=>T[x.team_id]=fromRow(x));FIN=b[0]?{w:b[0].winners,note:b[0].note,manual:b[0].manual}:null},
 async save(d){await rq("evaluations?on_conflict=team_id",{...UP,body:JSON.stringify({team_id:d.team,evaluator:d.evaluator,state:d.state,inj:d.inj,cat:d.cat,notes:d.notes,cat_notes:d.catNotes,hist:d.hist})});T[d.team]=JSON.parse(JSON.stringify(d))},
 async setFinal(f){await rq("final_result?on_conflict=id",{...UP,body:JSON.stringify({id:1,winners:f.w,note:f.note,manual:f.manual})});FIN=f;render()},
 async delFinal(){await rq("final_result?id=eq.1",{method:"DELETE"});FIN=null;render()}};
async function refresh(){try{await api.load()}catch(e){if(view!="form")$("#app").innerHTML='<div class="card warn">Gagal terhubung ke database: '+esc(e.message)+'</div>';return}
 if(first||view=="home"||view=="board"||(view=="rekap"&&tab!="rank")){first=false;render()}}
async function init(){if(location.hash=="#board")view="board";await refresh();setInterval(refresh,15000)}
const LB=["","Sangat lemah","Kurang","Cukup","Baik","Sangat baik"];
const LV=["","Sangat lemah: respons minimal, hampir tidak relevan atau tanpa tindakan jelas.","Kurang: baru sebagian kecil indikator disentuh, belum jelas.","Cukup: sekitar separuh indikator terpenuhi, masih ada celah penting.","Baik: hampir semua indikator terpenuhi, tinggal penyempurnaan.","Sangat baik: semua indikator terpenuhi, keputusan jelas dan dapat dilaksanakan."];
let reveal=false,first=true;
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.textContent=m;t.className="show";clearTimeout(t._h);t._h=setTimeout(()=>t.className="",2200)}
function go(v,id){if(v!="board"&&location.hash=="#board")history.replaceState(null,"",location.pathname+location.search);view=v;if(v=="form"){cur=id;D=JSON.parse(JSON.stringify(T[id]||blank(id)));D.hist=D.hist||[]}if(v=="board"){location.hash="board"}render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{view=location.hash=="#board"?"board":(view=="board"?"home":view);render()});
function render(){document.body.classList.toggle("bd",view=="board");view=="home"?home():view=="form"?form():view=="board"?board():rekap()}
function home(){$("#app").innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Pilih tim yang Anda nilai</h2><p class="mu">Ketuk satu tim, isi nama Anda, beri skor 1–5 pada setiap bagian, lalu kirim.</p><div class="grid">${TEAMS.map(t=>`<button class="tc" onclick="go('form','${t.id}')"><b>${esc(t.n)}</b><br>${badge(t.id)}<div class="mu">${esc(T[t.id]?.evaluator||"")}</div></button>`).join("")}</div></div><p class="mu" style="text-align:center"><a href="#board" onclick="go('board');return false">Scoring Board (layar peserta)</a> · <a href="#" onclick="go('rekap');return false">Rekap panitia</a></p>`}
const grp=(k,i,lock)=>`<div class="lv">${[1,2,3,4,5].map(n=>`<button ${lock?"disabled":""} data-k="${k}" data-i="${i}" data-n="${n}" onclick="setS('${k}',${i},${n})"><b>${n}</b><small>${LB[n]}</small></button>`).join("")}</div><div class="hint" id="h-${k}-${i}"></div>`;
function form(){
 const team=TEAMS.find(t=>t.id==cur),lock=D.state=="submitted";
 $("#app").innerHTML=`<div class="card"><b style="font-size:18px">Tim: ${esc(team.n)}</b> ${badge(cur)}<input id="ev" style="margin-top:8px" ${lock?"disabled":""} placeholder="Nama evaluator (wajib)" value="${esc(D.evaluator)}" oninput="D.evaluator=this.value;upd()">${lock?'<p class="warn">Penilaian terkirim dan terkunci. <button onclick="unlock()">Buka kunci</button></p>':""}
 <details><summary>Panduan skor 1–5</summary><ul class="r">${LV.map((t,n)=>n?`<li><b>${n} · ${LB[n]}</b> — ${t}</li>`:"").join("")}</ul></details></div>
 <h3>A. Respons terhadap Inject (60%)</h3><p class="mu">${INJ.map((x,i)=>`<div class="card" id="c-inj-${i}"><b>Inject ${i+1} — ${x[0]}</b><div class="mu" style="margin-top:4px">Indikator yang dicari:</div><ul class="r">${x[1].map(t=>`<li>${t}</li>`).join("")}</ul>${grp("inj",i,lock)}<details ${D.notes[i]?"open":""}><summary>＋ Catatan evaluator (opsional)</summary><textarea ${lock?"disabled":""} rows="2" oninput="D.notes[${i}]=this.value">${esc(D.notes[i])}</textarea></details></div>`).join("")}
 <h3>B. Kualitas Tim (40%)</h3><p class="mu">Skor 1–5 dikonversi otomatis ke bobot masing-masing aspek.</p>${CAT.map((c,i)=>`<div class="card" id="c-cat-${i}"><b>${c[0]}</b> <span class="mu">(bobot ${c[1]})</span><ul class="r">${CATI[i].map(t=>`<li>${t}</li>`).join("")}</ul>${grp("cat",i,lock)}</div>`).join("")}
 <div class="card"><b>Catatan umum (opsional)</b><textarea ${lock?"disabled":""} rows="3" oninput="D.catNotes=this.value">${esc(D.catNotes)}</textarea></div>
 <div class="bot"><div style="flex:1;min-width:190px"><div class="pg"><i id="prog"></i></div><div class="mu" id="pt"></div></div><div><button onclick="go('home')">Kembali</button> <button ${lock?"disabled":""} onclick="save('draft')">Simpan Draft</button> <button class="p" id="bs" onclick="save('submitted')">Kirim</button></div></div>`;
 upd()}
function setS(k,i,n){D[k][i]=n;upd()}
function upd(){
 document.querySelectorAll(".lv button").forEach(b=>b.classList.toggle("p",D[b.dataset.k][+b.dataset.i]===+b.dataset.n));
 ["inj","cat"].forEach(k=>D[k].forEach((v,i)=>{const h=$("#h-"+k+"-"+i);if(h)h.textContent=valid(v)?v+" · "+LB[v]+" — "+LV[v]:"Pilih skor 1–5 sesuai indikator di atas.";const c=$("#c-"+k+"-"+i);if(c)c.classList.toggle("ok",valid(v))}));
 const f=[...D.inj,...D.cat].filter(valid).length,nm=D.evaluator.trim();
 $("#prog").style.width=f/11*100+"%";
 $("#pt").innerHTML=`<b>${f}/11 skor terisi · Total sementara ${total(D)} / 100</b>${f<11?` · <a href="#" onclick="jump();return false">cari yang kosong</a>`:""}${nm?"":" · isi nama evaluator"}`;
 $("#bs").disabled=D.state=="submitted"||f<11||!nm}
function jump(){const el=[...document.querySelectorAll("[id^=c-]")].find(e=>!e.classList.contains("ok"));if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}
function board(){
 const R=rows(),sent=R.filter(x=>x.ok).length,show=reveal||!!FIN,{r}=ranking();
 let order=r;if(FIN)order=[...FIN.w.map(id=>r.find(x=>x.t.id==id)).filter(Boolean),...r.filter(x=>!FIN.w.includes(x.t.id))];
 const list=show?[...order,...R.filter(x=>!x.ok)]:R,med=["🥇","🥈","🥉"];
 $("#app").innerHTML=`<div class="bhd"><h1>Scoring Board</h1><p>Tabletop Exercise Keamanan Informasi</p><span class="b ${FIN?"ok":"wa"}">${FIN?"HASIL FINAL":show?"HASIL SEMENTARA":"PENILAIAN BERJALAN"} · ${sent} / 8 tim telah dinilai</span></div>
 ${list.map((x,i)=>{const showSc=show&&x.ok,rk=showSc?(FIN&&i<3?med[i]:i+1):"";const stt=x.ok?"Sudah dinilai":T[x.t.id]?"Sedang dinilai":"Menunggu";
 return `<div class="card br"><div class="rk">${rk}</div><div><div class="nm">${esc(x.t.n)}</div>${showSc?`<div class="bb"><i style="width:${x.tot}%"></i></div>`:`<div class="mu">${stt}</div>`}</div><div class="sc2">${showSc?x.tot:(x.ok?"✓":"")}${showSc&&x.tie&&!FIN?' <span class="b wa">Seri</span>':""}</div></div>`}).join("")}
 <div class="bctl"><button onclick="reveal=!reveal;board()">${show&&!FIN?"Sembunyikan skor":FIN?"Hasil final":"Tampilkan hasil"}</button> <button onclick="go('home')">Beranda</button></div>`}
function setSLegacy(){}
async function save(state){
 if(state=="submitted"){if(!done(D)||!D.evaluator.trim())return alert("Masih ada komponen kosong.");if(!confirm("Kirim dan kunci penilaian? Setelah dikirim, nilai tidak dapat diubah tanpa membuka kunci."))return}
 D.state=state;D.hist.push({a:state=="draft"?"simpan_draft":"kirim",by:D.evaluator,ts:Date.now(),total:total(D)});D.ts=Date.now();
 try{await api.save(D);toast(state=="draft"?"Draft tersimpan ✓":"Penilaian terkirim ✓");if(state=="submitted")go("home");else upd()}catch(e){alert("Gagal menyimpan: "+(e.message||e.code))}}
async function unlock(){if(!confirm("Buka kunci penilaian ini? Perubahan akan dicatat di riwayat."))return;D.state="reopened";D.hist.push({a:"dibuka_kembali",by:D.evaluator,ts:Date.now()});try{await api.save(D);form()}catch(e){alert(e.message)}}

function rows(){return TEAMS.map(t=>{const s=T[t.id],ok=s&&s.state=="submitted"&&done(s);return{t,s,ok,tot:ok?total(s):null,i:ok?sumInj(s)*1.5:null,w:ok?wt(s):null}})}
function ranking(){const r=rows().filter(x=>x.ok).sort((a,b)=>b.tot-a.tot||b.i-a.i||b.w[0]-a.w[0]||b.w[1]-a.w[1]||b.w[2]-a.w[2]);const k=x=>[x.tot,x.i,x.w[0],x.w[1],x.w[2]].join("|");r.forEach((x,i)=>x.tie=r.some((y,j)=>j!=i&&k(y)==k(x)));return{r,tieTop:r.some((x,i)=>x.tie&&i<3)}}
function rekap(){
 view="rekap";const R=rows(),sent=R.filter(x=>x.ok).length,tabs=[["ring","Ringkasan"],["det","Detail Tim"],["rank","Peringkat & Pemenang"],["log","Riwayat"]];
 let h=`<div class="tabs">${tabs.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';rekap()">${t[1]}</button>`).join("")}</div>`;
 if(tab=="ring"){const mx=Math.max(100,...R.map(x=>x.tot||0));
  h+=`<div class="grid"><div class="card kpi"><span class="mu">Jumlah tim</span><b>8</b></div><div class="card kpi"><span class="mu">Terkirim</span><b>${sent} / 8</b></div><div class="card kpi"><span class="mu">Draft / belum dimulai</span><b>${R.filter(x=>st(x.t.id)=="Draft").length} / ${R.filter(x=>st(x.t.id)=="Belum Dimulai").length}</b></div></div><p class="mu">Hasil: <b>${FIN?"FINAL":"SEMENTARA"}</b></p>
  <div class="card tw"><table><tr><th>Tim</th><th>Evaluator</th><th>Status</th><th>Skor</th></tr>${R.map(x=>`<tr><td>${esc(x.t.n)}</td><td>${esc(x.s?.evaluator||"—")}</td><td>${badge(x.t.id)}</td><td>${x.ok?x.tot:"—"}</td></tr>`).join("")}</table></div>
  <div class="card"><b>Perbandingan skor total</b>${R.map(x=>`<div class="bar"><span>${esc(x.t.n)}</span><i style="width:${(x.tot||0)/mx*60}%"></i><b>${x.ok?x.tot:"—"}</b></div>`).join("")}</div><button onclick="exportCsv()">Ekspor CSV</button>`}
 if(tab=="det"){const s=T[sel];h+=`<select onchange="sel=this.value;rekap()">${TEAMS.map(t=>`<option value="${t.id}" ${t.id==sel?"selected":""}>${esc(t.n)}</option>`).join("")}</select>`;
  h+=s&&s.inj?`<div class="card"><b>${esc(TEAMS.find(t=>t.id==sel).n)}</b> ${badge(sel)} · Evaluator: ${esc(s.evaluator)} · Total <b>${total(s)}</b></div><div class="card tw"><table><tr><th>Komponen</th><th>Skor</th><th>Catatan</th></tr>${INJ.map((q,i)=>`<tr><td>Inject ${i+1}: ${q[0]}</td><td>${s.inj[i]??"—"}</td><td>${esc(s.notes[i])}</td></tr>`).join("")}${CAT.map((c,i)=>`<tr><td>${c[0]} (×${c[1]})</td><td>${s.cat[i]??"—"} → ${wt(s)[i]}</td><td></td></tr>`).join("")}</table></div><div class="card">Catatan umum: ${esc(s.catNotes)||"—"}</div>`:`<div class="card">Belum ada data.</div>`}
 if(tab=="rank"){const {r,tieTop}=ranking(),all=sent==8;
  h+=`<div class="card"><b>Rekap peringkat</b> <span class="mu">(${all?"semua terkirim":"SEMENTARA — "+sent+"/8"})</span><div class="tw"><table><tr><th>#</th><th>Tim</th><th>Total</th><th>Respons Inject</th><th>Koordinasi</th><th>Keputusan</th><th>Akuntabilitas</th><th></th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.n)}</td><td>${x.tot}</td><td>${x.i}</td><td>${x.w[0]}</td><td>${x.w[1]}</td><td>${x.w[2]}</td><td>${x.tie?'<span class="b wa">Seri</span>':""}</td></tr>`).join("")}</table></div></div>`;
  if(all&&tieTop&&!FIN)h+=`<div class="card warn"><b>Seri tidak terselesaikan oleh semua tie-break.</b> Tetapkan manual dengan catatan.<div class="grid">${[0,1,2].map(i=>`<select id="mw${i}"><option value="">Tim Terbaik ${i+1}…</option>${TEAMS.map(t=>`<option value="${t.id}">${esc(t.n)}</option>`).join("")}</select>`).join("")}</div><textarea id="mnote" rows="2" placeholder="Catatan keputusan manual (wajib)"></textarea></div>`;
  h+=FIN?`<div class="card"><b>Pemenang (final)</b>${FIN.w.map((id,i)=>`<p>Tim Terbaik ${i+1}: <b>${esc(TEAMS.find(t=>t.id==id)?.n)}</b></p>`).join("")}${FIN.note?`<p class="mu">Catatan: ${esc(FIN.note)}</p>`:""}</div><button onclick="unfin()">Cabut hasil final</button>`:`<button class="p" ${all?"":"disabled"} onclick="finalize(${tieTop})">Tetapkan hasil final</button>`}
 if(tab=="log"){const L=Object.entries(T).flatMap(([id,x])=>(x.hist||[]).map(e=>({...e,team:id}))).sort((a,b)=>b.ts-a.ts).slice(0,100);h+=`<div class="card tw"><table><tr><th>Waktu</th><th>Tim</th><th>Aksi</th><th>Oleh</th><th>Total</th></tr>${L.map(a=>`<tr><td>${new Date(a.ts).toLocaleString("id-ID")}</td><td>${esc(TEAMS.find(t=>t.id==a.team)?.n)}</td><td>${esc(a.a)}</td><td>${esc(a.by)}</td><td>${a.total??""}</td></tr>`).join("")}</table></div>`}
 $("#app").innerHTML=h}
async function finalize(tie){const {r}=ranking();let w,note="";
 if(tie){w=[0,1,2].map(i=>$("#mw"+i)?.value);note=$("#mnote")?.value.trim();if(w.some(x=>!x)||new Set(w).size<3||!note)return alert("Pilih tiga tim berbeda dan isi catatan.")}else w=r.slice(0,3).map(x=>x.t.id);
 if(!confirm("Tetapkan hasil final?"))return;try{await api.setFinal({w,note,manual:!!tie})}catch(e){alert(e.message)}}
async function unfin(){if(confirm("Cabut hasil final?"))await api.delFinal()}
async function exportCsv(){const {r}=ranking(),rk=Object.fromEntries(r.map((x,i)=>[x.t.id,i+1]));
 const hd=["Tim","Evaluator","Status",...INJ.map((_,i)=>"Inject "+(i+1)),"Respons Inject (maks 60)",...CAT.map(c=>c[0]+" (berbobot)"),"Total","Peringkat"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const L=[hd,...rows().map(x=>[x.t.n,x.s?.evaluator||"",st(x.t.id),...(x.ok?x.s.inj:Array(8).fill("")),x.ok?x.i:"",...(x.ok?x.w:Array(3).fill("")),x.tot??"",rk[x.t.id]??""])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.map(l=>l.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="hasil-ttx-kpk.csv";a.click()}
init();
</script></body></html>
